<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <meta name="theme-color" content="#166534" />
    <meta
      name="description"
      content="WhatsApp Stickers - Crie e compartilhe seus próprios pacotes de adesivos"
    />
    <title>WhatsApp Stickers</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      html {
        font-size: 16px;
      }

      body {
        margin: 0;
        padding: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        background-color: #f9fafb;
        color: #111827;
        overflow-x: hidden;
      }

      @media (max-width: 768px) {
        html {
          font-size: 14px;
        }
      }

      @media (max-width: 480px) {
        html {
          font-size: 13px;
        }
      }

      /* Smooth transitions */
      a,
      button {
        transition: all 0.2s ease;
      }

      /* Images responsive */
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      /* Forms responsive */
      input,
      textarea,
      select {
        font-size: 1rem;
      }

      @media (max-width: 480px) {
        input,
        textarea,
        select {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
