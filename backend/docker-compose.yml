services:
    backend_db:
        container_name: backend_db
        image: postgres:16
        hostname: postgres-host
        environment:
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASS}
            - POSTGRES_DB=${DB_NAME}
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U postgres -d whatsapp_sticket_manager',
                ]
            interval: 5s
            timeout: 5s
            retries: 5
        ports:
            - '${DB_PORT}:${DB_PORT}'
        volumes:
            - pgdata:/var/lib/postgresql/data

    minio:
        container_name: minio
        image: minio/minio:latest
        hostname: minio-host
        environment:
            - MINIO_ROOT_USER=minioadmin
            - MINIO_ROOT_PASSWORD=minioadmin
        ports:
            - '${MINIO_PORT}:${MINIO_PORT}'
            - '9001:9001'
        healthcheck:
            test:
                [
                    'CMD',
                    'curl',
                    '-f',
                    'http://localhost:${MINIO_PORT}/minio/health/live',
                ]
            start_period: 5s
            interval: 30s
            timeout: 20s
            retries: 3
        volumes:
            - minio_data:/minio_data
        command: server /minio_data --console-address ":9001"

    minio-init:
        container_name: minio-init
        image: minio/mc:latest
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:${MINIO_PORT} minioadmin minioadmin;
            mc mb --ignore-existing local/${BUCKET_NAME};
            exit 0;
            "

    backend:
        container_name: backend
        build:
            context: .
            dockerfile: Dockerfile
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost:${PORT}/health']
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 5s
        env_file:
            - .env
        ports:
            - '${PORT}:${PORT}'
        depends_on:
            backend_db:
                condition: service_healthy
            minio:
                condition: service_healthy
            minio-init:
                condition: service_completed_successfully
        environment:
            - DB_HOST=backend_db
            - MINIO_END_POINT=http://minio:9000

volumes:
    pgdata:
    minio_data:
